<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1e1e2e">
  <title>Embody</title>
  <style>
    @property --c1 { syntax: '<color>'; inherits: true; initial-value: #5e60ce; }
    @property --c2 { syntax: '<color>'; inherits: true; initial-value: #7400b8; }

    * {
      box-sizing: border-box; margin: 0; padding: 0;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none; user-select: none;
    }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", system-ui, sans-serif;
      color: #cdd6f4;
      background: #11111b;
      overscroll-behavior: none;
      position: relative;
      transition: --c1 0.8s, --c2 0.8s;
    }

    .backdrop {
      position: fixed; inset: -15%;
      background: linear-gradient(135deg, var(--c1), var(--c2));
      filter: blur(90px) saturate(1.3);
      opacity: 0.55;
      z-index: -2;
      transition: --c1 0.8s, --c2 0.8s;
    }
    .backdrop::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(17,17,27,0.3) 0%, rgba(17,17,27,0.85) 100%);
      z-index: -1;
    }

    .app {
      max-width: 460px;
      margin: 0 auto;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: max(env(safe-area-inset-top), 14px) 24px max(env(safe-area-inset-bottom), 18px);
    }

    .topbar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 4px 8px;
      font-size: 11px;
      letter-spacing: 2px;
      opacity: 0.55;
    }
    .topbar-mid { font-weight: 700; text-transform: uppercase; }
    .topbar-side {
      width: 28px; height: 28px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
    }

    .cover-wrap {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px 0;
    }
    .cover {
      position: relative;
      width: min(78vw, 50vh, 340px);
      aspect-ratio: 1;
      border-radius: 22px;
      background:
        radial-gradient(circle at 28% 22%, rgba(255,255,255,0.38), transparent 45%),
        radial-gradient(circle at 78% 70%, rgba(0,0,0,0.30), transparent 55%),
        radial-gradient(circle at 60% 30%, rgba(255,255,255,0.18), transparent 38%),
        linear-gradient(135deg, var(--c1), var(--c2));
      box-shadow:
        0 30px 60px rgba(0,0,0,0.55),
        0 0 0 1px rgba(255,255,255,0.04) inset,
        0 0 80px var(--c1);
      transition: --c1 0.8s, --c2 0.8s, transform 0.4s, box-shadow 0.6s;
      animation: spin 80s linear infinite;
      animation-play-state: paused;
      transform: scale(0.95);
    }
    .cover.playing {
      animation-play-state: running;
      transform: scale(1);
    }
    .cover::after {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      width: 14px; height: 14px;
      margin: -7px 0 0 -7px;
      border-radius: 50%;
      background: rgba(17, 17, 27, 0.7);
      box-shadow: 0 0 0 2px rgba(255,255,255,0.08);
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .cover.playing { animation: spin 80s linear infinite, scale-in 0.4s ease forwards; }
    @keyframes scale-in {
      from { transform: scale(0.95); }
      to   { transform: scale(1); }
    }

    .meta { flex: 0 0 auto; padding: 18px 4px 6px; }
    .title {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.4px;
      line-height: 1.2;
      margin-bottom: 8px;
      transition: opacity 0.3s;
    }
    .subtitle {
      font-size: 12px;
      opacity: 0.5;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-weight: 600;
    }

    .progress { flex: 0 0 auto; padding: 14px 0 4px; }
    .seek {
      -webkit-appearance: none; appearance: none;
      width: 100%; height: 4px;
      background: linear-gradient(to right,
        rgba(255,255,255,0.85) var(--pct, 0%),
        rgba(255,255,255,0.15) var(--pct, 0%));
      border-radius: 2px;
      cursor: pointer; outline: none;
      transition: height 0.15s;
    }
    .seek:hover, .seek:active { height: 6px; }
    .seek::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
      opacity: 0;
      transition: opacity 0.15s;
    }
    .seek:hover::-webkit-slider-thumb,
    .seek:active::-webkit-slider-thumb { opacity: 1; }
    .seek::-moz-range-thumb {
      width: 14px; height: 14px;
      border-radius: 50%;
      background: #fff;
      border: none;
      cursor: pointer;
    }
    .times {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-family: "SF Mono", Menlo, Consolas, monospace;
      opacity: 0.5;
      margin-top: 10px;
      letter-spacing: 0.5px;
    }

    .controls {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 28px;
      padding: 12px 0 16px;
    }
    .btn {
      background: transparent; border: none;
      color: #cdd6f4;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.15s, opacity 0.2s;
      padding: 0;
    }
    .btn:active { transform: scale(0.9); }
    .btn-skip {
      width: 44px; height: 44px;
      opacity: 0.85;
    }
    .btn-skip svg { width: 26px; height: 26px; fill: currentColor; }
    .btn-play {
      width: 68px; height: 68px;
      border-radius: 50%;
      background: #fff;
      color: #1e1e2e;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35), 0 0 0 1px rgba(0,0,0,0.05);
    }
    .btn-play svg { width: 28px; height: 28px; fill: currentColor; }
    .btn-play:active { transform: scale(0.92); }

    .source {
      flex: 0 0 auto;
      padding: 12px 16px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    .sensor { display: flex; align-items: center; gap: 8px; opacity: 0.85; }
    .sensor-icon {
      width: 14px; height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }
    .sensor-distance { font-family: "SF Mono", Menlo, monospace; opacity: 0.75; min-width: 64px; }
    .conn { display: flex; align-items: center; gap: 7px; text-transform: uppercase; font-weight: 700; letter-spacing: 1.2px; opacity: 0.75; font-size: 10px; }
    .conn-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #f38ba8;
      transition: background 0.3s, box-shadow 0.3s;
    }
    .conn.online .conn-dot {
      background: #a6e3a1;
      box-shadow: 0 0 8px #a6e3a1;
    }

    .banner {
      position: fixed;
      left: 50%;
      bottom: max(env(safe-area-inset-bottom), 20px);
      transform: translateX(-50%) translateY(150%);
      background: rgba(203, 166, 247, 0.96);
      color: #1e1e2e;
      padding: 13px 22px;
      border-radius: 100px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 100;
      pointer-events: none;
      white-space: nowrap;
    }
    .banner.show { transform: translateX(-50%) translateY(0); }

    .welcome {
      position: fixed; inset: 0;
      z-index: 200;
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(ellipse 100% 80% at 50% 50%, #1a1626 0%, #0a0814 100%);
      transition: opacity 0.7s ease, visibility 0s linear 0.7s;
    }
    .welcome.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.7s ease, visibility 0s linear 0.7s;
    }
    .welcome-content {
      text-align: center;
      padding: 0 32px;
      animation: welcome-in 1.2s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    @keyframes welcome-in {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .welcome-orb-wrap {
      width: clamp(160px, 36vw, 200px);
      aspect-ratio: 1;
      margin: 0 auto 60px;
      animation: orb-breathe 6.5s ease-in-out infinite;
    }
    .welcome-orb {
      width: 100%; height: 100%;
      border-radius: 50%;
      background:
        radial-gradient(circle at 30% 28%, rgba(255,255,255,0.55), transparent 45%),
        radial-gradient(circle at 72% 70%, rgba(20,10,40,0.45), transparent 55%),
        radial-gradient(circle at 62% 32%, rgba(255,255,255,0.2), transparent 35%),
        linear-gradient(135deg, #cba6f7 0%, #f5a3b8 55%, #fce0c0 100%);
      box-shadow:
        0 40px 100px rgba(203, 166, 247, 0.35),
        0 0 60px rgba(245, 163, 184, 0.18),
        0 0 0 1px rgba(255,255,255,0.04) inset;
      animation: orb-spin 70s linear infinite;
    }
    @keyframes orb-breathe {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.04); }
    }
    @keyframes orb-spin {
      to { transform: rotate(360deg); }
    }
    .welcome-title {
      font-size: clamp(42px, 10vw, 54px);
      font-weight: 300;
      letter-spacing: -1.4px;
      margin-bottom: 14px;
      color: #fff;
      line-height: 1;
    }
    .welcome-sub {
      font-family: Georgia, "Times New Roman", serif;
      font-style: italic;
      font-size: 14px;
      opacity: 0.45;
      letter-spacing: 0.3px;
      margin-bottom: 58px;
      font-weight: 400;
    }
    .welcome-cta {
      background: transparent;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.22);
      border-radius: 100px;
      padding: 13px 36px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 2.6px;
      text-transform: uppercase;
      cursor: pointer;
      transition: border-color 0.3s ease, background 0.3s ease, transform 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .welcome-cta:hover {
      border-color: rgba(255,255,255,0.55);
      background: rgba(255,255,255,0.05);
    }
    .welcome-cta:active { transform: scale(0.95); }
  </style>
</head>
<body>
  <div class="welcome" id="welcome">
    <div class="welcome-content">
      <div class="welcome-orb-wrap">
        <div class="welcome-orb"></div>
      </div>
      <h1 class="welcome-title">space</h1>
      <p class="welcome-sub">music that listens</p>
      <button class="welcome-cta" id="welcomeCta">begin</button>
    </div>
  </div>

  <div class="backdrop"></div>

  <div class="app">
    <header class="topbar">
      <span class="topbar-side">⌄</span>
      <span class="topbar-mid">Now Playing</span>
      <span class="topbar-side">⋯</span>
    </header>

    <div class="cover-wrap">
      <div class="cover" id="cover"></div>
    </div>

    <div class="meta">
      <div class="title" id="title">—</div>
      <div class="subtitle" id="subtitle">— · —</div>
    </div>

    <div class="progress">
      <input type="range" class="seek" id="seek" min="0" max="1000" step="1" value="0" />
      <div class="times">
        <span id="cur">0:00</span>
        <span id="dur">0:00</span>
      </div>
    </div>

    <div class="controls">
      <button class="btn btn-skip" id="prev" aria-label="Previous">
        <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>
      <button class="btn btn-play" id="play" aria-label="Play/Pause">
        <svg id="playIcon" viewBox="0 0 24 24"><path id="playPath" d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="btn btn-skip" id="next" aria-label="Next">
        <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zm-2 6L5.5 18V6z"/></svg>
      </button>
    </div>

    <div class="source">
      <div class="sensor">
        <svg class="sensor-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M2 8.82a15 15 0 0 1 20 0"/>
          <path d="M5 12.55a11 11 0 0 1 14 0"/>
          <path d="M8.5 16.43a6 6 0 0 1 7 0"/>
          <line x1="12" y1="20" x2="12.01" y2="20"/>
        </svg>
        <span class="sensor-distance" id="distance">— cm</span>
      </div>
      <div class="conn" id="conn">
        <span class="conn-dot"></span>
        <span id="connText">Offline</span>
      </div>
    </div>
  </div>

  <audio id="audio" preload="metadata"></audio>
  <div class="banner" id="banner">Tap anywhere to enable audio</div>

  <script>
    const PLAYLIST = [
      { src: 'A Gentle Promise.m4a',      title: 'A Gentle Promise',     gradient: ['#f5a3b8', '#fce0c0'] },
      { src: 'Daydreams of the Mind.m4a', title: 'Daydreams of the Mind', gradient: ['#a3b8f5', '#cba6f7'] },
      { src: 'Healing Sleep.m4a',         title: 'Healing Sleep',         gradient: ['#5e60ce', '#7400b8'] },
      { src: 'The Secret Place.m4a',      title: 'The Secret Place',      gradient: ['#5fb89a', '#3d7e6c'] },
    ];
    const N = PLAYLIST.length;

    const ICON_PLAY  = 'M8 5v14l11-7z';
    const ICON_PAUSE = 'M6 5h4v14H6zM14 5h4v14h-4z';

    const $ = (id) => document.getElementById(id);
    const audio = $('audio'), cover = $('cover'), titleEl = $('title'), subtitleEl = $('subtitle');
    const seekEl = $('seek'), curEl = $('cur'), durEl = $('dur');
    const playBtn = $('play'), prevBtn = $('prev'), nextBtn = $('next'), playPath = $('playPath');
    const distanceEl = $('distance'), conn = $('conn'), connText = $('connText'), banner = $('banner');

    let currentIndex = 0;
    let seeking = false;
    let unlocked = false;

    const fmt = (s) => {
      if (!isFinite(s) || s < 0) return '0:00';
      const m = Math.floor(s / 60);
      const r = Math.floor(s % 60);
      return `${m}:${r.toString().padStart(2, '0')}`;
    };

    function loadTrack(i) {
      currentIndex = ((i % N) + N) % N;
      const track = PLAYLIST[currentIndex];
      audio.src = encodeURIComponent(track.src);
      titleEl.textContent = track.title;
      subtitleEl.textContent = `Track ${currentIndex + 1} of ${N}`;
      document.title = `${track.title} · Embody`;

      document.documentElement.style.setProperty('--c1', track.gradient[0]);
      document.documentElement.style.setProperty('--c2', track.gradient[1]);

      curEl.textContent = '0:00';
      durEl.textContent = '0:00';
      seekEl.value = 0;
      seekEl.style.setProperty('--pct', '0%');

      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: track.title,
          album: 'Embody',
        });
      }
    }

    function tryPlay() {
      const p = audio.play();
      if (p && p.catch) p.catch(() => { if (!unlocked) banner.classList.add('show'); });
    }

    audio.addEventListener('play', () => {
      cover.classList.add('playing');
      playPath.setAttribute('d', ICON_PAUSE);
      unlocked = true;
      banner.classList.remove('show');
      if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
    });
    audio.addEventListener('pause', () => {
      cover.classList.remove('playing');
      playPath.setAttribute('d', ICON_PLAY);
      if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
    });
    audio.addEventListener('ended', () => {
      loadTrack(currentIndex + 1);
      tryPlay();
    });
    audio.addEventListener('timeupdate', () => {
      if (seeking) return;
      curEl.textContent = fmt(audio.currentTime);
      if (audio.duration) {
        const pct = (audio.currentTime / audio.duration) * 1000;
        seekEl.value = pct;
        seekEl.style.setProperty('--pct', `${pct / 10}%`);
      }
    });
    audio.addEventListener('loadedmetadata', () => {
      durEl.textContent = fmt(audio.duration);
    });

    playBtn.addEventListener('click', () => audio.paused ? tryPlay() : audio.pause());
    prevBtn.addEventListener('click', () => { loadTrack(currentIndex - 1); tryPlay(); });
    nextBtn.addEventListener('click', () => { loadTrack(currentIndex + 1); tryPlay(); });

    seekEl.addEventListener('input', (e) => {
      seeking = true;
      seekEl.style.setProperty('--pct', `${e.target.value / 10}%`);
      if (audio.duration) curEl.textContent = fmt((e.target.value / 1000) * audio.duration);
    });
    seekEl.addEventListener('change', () => {
      if (audio.duration) audio.currentTime = (seekEl.value / 1000) * audio.duration;
      seeking = false;
    });

    document.addEventListener('click', () => {
      if (banner.classList.contains('show')) {
        banner.classList.remove('show');
        tryPlay();
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT') return;
      if (e.code === 'Space')      { e.preventDefault(); audio.paused ? tryPlay() : audio.pause(); }
      else if (e.code === 'ArrowRight') { loadTrack(currentIndex + 1); tryPlay(); }
      else if (e.code === 'ArrowLeft')  { loadTrack(currentIndex - 1); tryPlay(); }
    });

    if ('mediaSession' in navigator) {
      navigator.mediaSession.setActionHandler('play',           () => tryPlay());
      navigator.mediaSession.setActionHandler('pause',          () => audio.pause());
      navigator.mediaSession.setActionHandler('previoustrack',  () => { loadTrack(currentIndex - 1); tryPlay(); });
      navigator.mediaSession.setActionHandler('nexttrack',      () => { loadTrack(currentIndex + 1); tryPlay(); });
    }

    function connectSSE() {
      const es = new EventSource('/events');
      es.onopen = () => { conn.classList.add('online'); connText.textContent = 'Live'; };
      es.onmessage = (e) => {
        try {
          const { status, distance } = JSON.parse(e.data);
          distanceEl.textContent = `${distance.toFixed(1)} cm`;
          if (status === 1 && audio.paused) tryPlay();
          else if (status === 0 && !audio.paused) audio.pause();
        } catch (err) { console.error(err); }
      };
      es.onerror = () => { conn.classList.remove('online'); connText.textContent = 'Offline'; };
    }

    const welcomeEl = $('welcome');
    $('welcomeCta').addEventListener('click', async () => {
      try {
        audio.muted = true;
        await audio.play();
        audio.pause();
        audio.muted = false;
        unlocked = true;
      } catch (_) {}
      welcomeEl.classList.add('hidden');
    });

    loadTrack(0);
    connectSSE();
  </script>
</body>
</html>
